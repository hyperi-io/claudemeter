# Gitleaks configuration - exclude false positives
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
description = "Claudemeter false positives"

# Paths to ignore.
#
# Scoped to the specific documents that carry placeholder credentials, NOT all
# markdown: a blanket `\.md$` exempts every doc in the repo, so a real
# credential pasted into one is permanently invisible to the scanner. The
# placeholder regexes below already cover the shapes those documents use, and
# they apply everywhere rather than to a file extension.
paths = [
    '''^README\.md$''',
    '''^CHANGELOG\.md$''',
    '''^docs/.*\.md$''',
    '''package-lock\.json''',
]

# Regex patterns that are false positives (placeholders in docs)
regexes = [
    '''YOUR_.*_HERE''',
    '''PLACEHOLDER''',
    '''example\.com''',
]
