name: Quality

# Lint, test and build, defined ONCE and called by both CI and Release.
#
# CI and Release are separate workflows triggered by the same push, so CI going
# red does not by itself stop a publish - Release has to run this gate itself.
# It calls this definition rather than holding a copy, so the gate that guards
# the Marketplace is the same one that guards a pull request, and the two
# cannot drift apart.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags are needed to check the committed version against the last
          # release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Match the extension-host Node for our engines.vscode floor; keep in
          # step with .nvmrc + engines.node. Bump only when the floor is raised
          # - see CONTRIBUTING.md / assets/src/deps_node_guard.py.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for build errors
        run: |
          if [ ! -f dist/extension.js ]; then
            echo "::error::Build failed - dist/extension.js not found"
            exit 1
          fi
          echo "✓ Build successful"

      - name: Verify package.json
        run: |
          # Check required fields exist
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'displayName', 'version', 'publisher', 'engines', 'main'];
            const missing = required.filter(f => !pkg[f]);
            if (missing.length) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('✓ package.json valid');
          "

      - name: Verify the committed version matches the last release
        # semantic-release owns this field: it bumps, tags and commits it as
        # one step, so the committed value equals the newest tag until the next
        # release moves both. A hand-edited version is the only way they drift,
        # and it makes the packaged VSIX claim a version that was never cut.
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No tags yet - nothing to compare"
            exit 0
          fi
          COMMITTED=$(node -p "require('./package.json').version")
          if [ "v$COMMITTED" != "$LAST_TAG" ]; then
            echo "::error::package.json is $COMMITTED but the last tag is $LAST_TAG - only semantic-release may change this field"
            exit 1
          fi
          echo "✓ version $COMMITTED matches $LAST_TAG"
