name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore']
  workflow_dispatch:

# CI only reads the repo - no job needs the default write token
permissions:
  contents: read

jobs:
  # Both gates are shared with Release, so the checks that guard a publish are
  # the same ones that ran here. See .github/workflows/{security,quality}.yml.
  security:
    name: Security
    uses: ./.github/workflows/security.yml


  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  package:
    name: Package
    needs: [security, quality]
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Match the extension-host Node for our engines.vscode floor; keep in
          # step with .nvmrc + engines.node. Bump only when the floor is raised
          # - see CONTRIBUTING.md / assets/src/deps_node_guard.py.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        # Same command Release publishes from, so this job validates the
        # artefact that actually ships rather than a differently-built one.
        run: npm run package

      - name: Verify the package ships no sourcemap
        run: |
          VSIX_FILE=$(ls *.vsix | head -1)
          if unzip -l "$VSIX_FILE" | grep -q '\.map$'; then
            echo "::error::$VSIX_FILE contains a sourcemap"
            exit 1
          fi
          echo "✓ no sourcemap in $VSIX_FILE"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claudemeter-vsix
          path: '*.vsix'
          retention-days: 7
