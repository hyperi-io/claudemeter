name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default the token to read-only - the release/publish jobs declare
# their own write scopes (and do their writes via the App token anyway)
permissions:
  contents: read

jobs:
  # Security gate - must pass before release. Same definition CI calls.
  security:
    name: Security Gate
    uses: ./.github/workflows/security.yml

  # Quality gate - must pass before release.
  #
  # CI and Release are separate workflows on the same push, so a red CI does not
  # by itself stop a publish. Tests only mean something if they can block what
  # they test, so the release chain runs them itself rather than assuming the
  # other workflow went green. Same definition CI calls.
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality.yml

  # Semantic release - creates version tags and changelog
  release:
    name: Release
    needs: [security, quality]
    if: github.repository == 'hyperi-io/claudemeter'
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Match the extension-host Node for our engines.vscode floor; keep in
          # step with .nvmrc + engines.node. Bump only when the floor is raised
          # - see CONTRIBUTING.md / assets/src/deps_node_guard.py.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Build and publish VSIX to GitHub Releases
  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Match the extension-host Node for our engines.vscode floor; keep in
          # step with .nvmrc + engines.node. Bump only when the floor is raised
          # - see CONTRIBUTING.md / assets/src/deps_node_guard.py.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        # `npm run package`, NOT a bare build: it is the only path that runs
        # esbuild with --production and strips dist/*.map before packaging.
        # `.vscodeignore` cannot exclude the sourcemap on its own - `!dist/**`
        # re-includes it and vsce does not re-exclude afterwards - so a bare
        # build ships an unminified bundle and its sourcemap.
        run: npm run package

      - name: Get VSIX filename
        id: vsix
        run: |
          VSIX_FILE=$(ls *.vsix | head -1)
          echo "filename=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $VSIX_FILE"

      - name: Verify the package ships no sourcemap
        env:
          VSIX_FILE: ${{ steps.vsix.outputs.filename }}
        run: |
          if unzip -l "$VSIX_FILE" | grep -q '\.map$'; then
            echo "::error::$VSIX_FILE contains a sourcemap"
            exit 1
          fi
          echo "✓ no sourcemap in $VSIX_FILE"

      - name: Upload VSIX to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: ${{ steps.vsix.outputs.filename }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish to VS Code Marketplace
        # Publishes the SAME artefact uploaded to the release above, rather
        # than rebuilding one. Values reach the shell through env, never
        # interpolated into the script.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_FILE: ${{ steps.vsix.outputs.filename }}
        run: npx @vscode/vsce publish --packagePath "$VSIX_FILE"

      - name: Summary
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          VSIX_FILE: ${{ steps.vsix.outputs.filename }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release Published"
            echo ""
            echo "**Version:** v$VERSION"
            echo "**VSIX:** $VSIX_FILE"
            echo ""
            echo "[View Release](https://github.com/$REPO/releases/tag/v$VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"
